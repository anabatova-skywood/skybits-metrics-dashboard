name: Refresh dashboard data & deploy

on:
  schedule:
    - cron: "0 * * * *"   # hourly (UTC); GitHub may delay scheduled runs a few minutes
  workflow_dispatch: {}    # allow manual runs from the Actions tab
  push:
    branches: [main]       # redeploy on content changes

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Refresh data.json from Datadog RUM
        continue-on-error: true   # deploy the committed snapshot even if secrets aren't set yet
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
          DD_SITE: ${{ secrets.DD_SITE }}
        run: node scripts/fetch-metrics.mjs

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
